name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '42 12 * * *'

concurrency:
  group: ${{ github.workflow }}-scheduled-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  latest:
    name: With latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@9a1d20035bdbcbc899baabe1e402e85bc33639bc # 1.90.0
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-hack@0.6.45
      - run: cargo update
      - run: cargo test --locked --all-features --doc
      - run: cargo hack --locked --rust-version --feature-powerset --skip default test --lib
        env:
          RUSTFLAGS: -D deprecated
